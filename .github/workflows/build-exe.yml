name: Gerar ForjaVideo.exe
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Gerar .exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name ForjaVideo
          --add-data "assets;assets"
          --collect-all imageio_ffmpeg --collect-all edge_tts --collect-all certifi
          --hidden-import pyttsx3.drivers --hidden-import pyttsx3.drivers.sapi5
          main.py
      - uses: actions/upload-artifact@v4
        with:
          name: ForjaVideo-windows
          path: dist/ForjaVideo.exe
