name: Gerar ForjaVideo (Windows)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Se preenchido (ex.: v1.0.0), publica uma release com este nome"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Testes do código (sem janela)
        run: |
          python tests/net_mock_test.py
          python tests/smoke_test.py
          python tests/selftest_mock.py

      - name: Gerar pasta do programa (onedir)
        run: >
          pyinstaller --noconfirm --clean --windowed --name ForjaVideo
          --add-data "assets;assets"
          --collect-all imageio_ffmpeg --collect-all edge_tts --collect-all certifi
          --hidden-import pyttsx3.drivers --hidden-import pyttsx3.drivers.sapi5
          main.py

      - name: Gerar .exe único (onefile)
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name ForjaVideo
          --distpath dist_onefile --workpath build_onefile
          --add-data "assets;assets"
          --collect-all imageio_ffmpeg --collect-all edge_tts --collect-all certifi
          --hidden-import pyttsx3.drivers --hidden-import pyttsx3.drivers.sapi5
          main.py

      - name: Autoteste do programa (pasta) — abre a janela de verdade
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\ForjaVideo\ForjaVideo.exe" -ArgumentList "--selftest","selftest_pasta" -Wait -PassThru
          if (Test-Path selftest_pasta\selftest.log) { Get-Content selftest_pasta\selftest.log }
          "codigo de saida: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Autoteste do .exe único — abre a janela de verdade
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist_onefile\ForjaVideo.exe" -ArgumentList "--selftest","selftest_exe" -Wait -PassThru
          if (Test-Path selftest_exe\selftest.log) { Get-Content selftest_exe\selftest.log }
          "codigo de saida: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Publicar capturas de tela do autoteste (branch capturas)
        if: always() && github.event_name == 'workflow_dispatch'
        shell: pwsh
        continue-on-error: true
        run: |
          $cap = Join-Path $env:RUNNER_TEMP "cap"
          Remove-Item -Recurse -Force $cap -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $cap | Out-Null
          foreach ($d in "selftest_pasta","selftest_exe") {
            if (Test-Path $d) {
              Get-ChildItem $d -File | ForEach-Object { Copy-Item $_.FullName (Join-Path $cap ("$d-" + $_.Name)) }
            }
          }
          Set-Location $cap
          git init -b capturas
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -m "Capturas do autoteste (execucao ${{ github.run_id }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" capturas

      - name: Empacotar
        shell: pwsh
        run: |
          Copy-Item dist_onefile\ForjaVideo.exe ForjaVideo.exe
          Compress-Archive -Path dist\ForjaVideo -DestinationPath ForjaVideo-pasta.zip

      - name: Guardar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoteste
          path: |
            selftest_pasta
            selftest_exe
          if-no-files-found: ignore

      - name: Guardar programa
        uses: actions/upload-artifact@v4
        with:
          name: ForjaVideo-windows
          path: |
            ForjaVideo.exe
            ForjaVideo-pasta.zip

      - name: Publicar na página de Releases
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
        run: >
          gh release create "$env:TAG" ForjaVideo.exe ForjaVideo-pasta.zip
          --target "${{ github.sha }}" --title "ForjaVideo $env:TAG" --notes-file RELEASE_NOTES.md
